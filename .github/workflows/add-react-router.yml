name: Add React Router

on:
  push:
    branches:
      - issue-4-frontend-boilerplate
    paths:
      - .github/workflows/add-react-router.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: issue-4-frontend-boilerplate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install React Router
        run: npm install react-router@latest --workspace @dev-standard/frontend

      - name: Format
        run: npm run format

      - name: Verify routing changes
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
          npm run build-storybook

      - name: Commit dependency graph and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-react-router.yml
          git add frontend/package.json package-lock.json frontend/src frontend/AGENTS.md frontend/README.md frontend/SKILLS.md frontend/e2e
          git commit -m "feat(frontend): add React Router data mode"
          git push
