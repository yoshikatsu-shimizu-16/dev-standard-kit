name: Finalize JSDoc Harness

on:
  push:
    branches:
      - issue-4-frontend-boilerplate
    paths:
      - '.github/workflows/finalize-jsdoc-harness.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: issue-4-frontend-boilerplate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Register H068 in Harness Catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.agents/harness-engineering/harness-catalog.yaml')
          text = path.read_text()
          entry = '  - { id: H068, category: static-analysis, name: public-api-jsdoc, priority: P0, source: "dev-standard-kit", purpose: "公開APIの契約・制約・副作用をJSDocとして必須化し、AIと人間の理解可能性を保つ" }\n'
          if 'id: H068' not in text:
              text = text.rstrip() + '\n' + entry
              path.write_text(text)
          PY

      - name: Verify JSDoc lint gate
        run: npm run lint

      - name: Commit formatted files and catalog
        run: |
          rm .github/workflows/finalize-jsdoc-harness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(harness): finalize public API JSDoc gate"
          git push
