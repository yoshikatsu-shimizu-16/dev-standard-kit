name: Add JSDoc Harness

on:
  push:
    branches:
      - issue-4-frontend-boilerplate
    paths:
      - '.github/workflows/add-jsdoc-harness.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: issue-4-frontend-boilerplate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install eslint-plugin-jsdoc
        run: npm install --save-dev eslint-plugin-jsdoc@latest --workspace @dev-standard/frontend

      - name: Commit dependency graph and remove bootstrap workflow
        run: |
          rm .github/workflows/add-jsdoc-harness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json package-lock.json .github/workflows/add-jsdoc-harness.yml
          git commit -m "chore(frontend): add JSDoc lint dependency"
          git push
